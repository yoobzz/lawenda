<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>mama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        @font-face {
            font-family: 'ABC Diatype Rounded';
            src: url('/fonts/ABCDiatypeRoundedVariable-Trial.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; max-width: 100vw; }

        body {
            font-family: 'ABC Diatype Rounded', 'Inter', sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
            color: #1a1a1a;
            overflow: hidden;
            max-width: 100vw;
            touch-action: manipulation;
            min-height: 100vh;
            cursor: pointer;
        }

        .container {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
            z-index: 1;
            pointer-events: none;
            background: transparent;
        }
        .container > * { pointer-events: auto; }

        .title {
            font-family: 'ABC Diatype Rounded', 'Inter', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #000000;
            user-select: none;
            cursor: pointer;
            opacity: 0;
            display: block;
            white-space: nowrap;
        }

        .title-emerging {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            opacity: 0;
        }

        @keyframes emergeFromStar {
            0%   { opacity: 0;   transform: translate(-50%, -50%) scale(0.8);    filter: blur(15px); }
            30%  { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9);    filter: blur(8px);  }
            70%  { opacity: 0.8; transform: translate(-50%, -50%) scale(1.02);   filter: blur(2px);  }
            100% { opacity: 1;   transform: translate(-50%, -50%) scale(1);      filter: blur(0px);  }
        }

        .title-breathing { animation: breathe3d 6s ease-in-out infinite; }

        @keyframes breathe3d {
            0%, 100% { transform: translate(-50%, -50%) rotateX(0deg)  rotateY(0deg)  scale(1);     opacity: 0.9; }
            50%       { transform: translate(-50%, -50%) rotateX(2deg)  rotateY(3deg)  scale(1.008); opacity: 1;   }
        }

        /* ── Star fog ── */
        .star-fog {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            perspective: 2000px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .star-fog .star-particle { z-index: 10 !important; }

        .star-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
        }

        .star-particle {
            position: absolute;
            font-family: 'ABC Diatype Rounded', 'Inter', sans-serif;
            color: rgb(150, 130, 220);
            font-size: 0.85rem;
            font-weight: 300;
            user-select: none;
            will-change: transform, opacity;
            animation: particleSway 22s ease-in-out infinite alternate;
            opacity: 0;
            pointer-events: auto !important;
            z-index: 10 !important;
            cursor: pointer;
            --appear-x: 0px;
            --appear-y: 0px;
            transform: scale(0.2) translate(calc(var(--appear-x) * 2), calc(var(--appear-y) * 2)) translateZ(0);
            transition: opacity 1s ease-out, transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .star-particle.typing-in {
            opacity: 0.5;
            transform: scale(1) translate(0, 0) translateZ(0);
        }

        @keyframes particleSway {
            0%   { transform: translate3d(0px,   0px, 0px); }
            25%  { transform: translate3d(3px,  -4px, 0px); }
            50%  { transform: translate3d(0px,  -6px, 0px); }
            75%  { transform: translate3d(-3px, -4px, 0px); }
            100% { transform: translate3d(0px,   0px, 0px); }
        }

        /* ── Hint ── */
        .hint {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #000;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        body.leaving { animation: leaveOut 0.55s ease forwards; pointer-events: none; }

        @keyframes leaveOut {
            to { opacity: 0; transform: scale(0.98); }
        }

        @media (max-width: 640px) {
            .star-fog { z-index: 0; }
            .title { font-size: clamp(1.6rem, 6vw, 2.5rem); padding: 0 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="star-fog" id="starFog">
        <div class="star-container" id="starContainer"></div>
    </div>

    <div class="container" id="landingContainer">
        <h1 class="title title-emerging" id="title">mama</h1>
    </div>

    <span class="hint" id="hint">dotknij żeby wejść</span>

    <script>
        var CHARS = ['_', '-', '~', '"', '|', ',', '*', '^', ':', ';', '.', '+', '=', '`', "'", '!'];

        function randStr(min, max) {
            min = min || 2; max = max || 4;
            var len = Math.floor(Math.random() * (max - min + 1)) + min;
            var s = '';
            for (var i = 0; i < len; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
            return s;
        }

        function createStarFog() {
            var container = document.getElementById('starContainer');
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduced) return;

            var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            var count = isTouch ? 80 : 200;

            for (var i = 0; i < count; i++) {
                var p = document.createElement('div');
                p.className = 'star-particle';
                p.textContent = randStr();
                p.style.left = Math.random() * window.innerWidth + 'px';
                p.style.top  = Math.random() * window.innerHeight + 'px';
                p.style.animationDelay    = (Math.random() * 4).toFixed(2) + 's';
                p.style.animationDuration = (9 + Math.random() * 6).toFixed(2) + 's';
                container.appendChild(p);
            }

            var particles = container.querySelectorAll('.star-particle');
            particles.forEach(function(p, idx) {
                var delay = Math.min(idx * 12 + Math.random() * 200, 2500);
                var rx = (Math.random() - 0.5) * 30;
                var ry = (Math.random() - 0.5) * 30;
                p.style.setProperty('--appear-x', rx + 'px');
                p.style.setProperty('--appear-y', ry + 'px');
                p.dataset.orig = p.textContent;
                setTimeout(function(el) { return function() { el.classList.add('typing-in'); }; }(p), delay);
            });

            container.addEventListener('mouseenter', function(e) {
                var p = e.target.closest && e.target.closest('.star-particle');
                if (!p) return;
                p.textContent = randStr();
                p.style.opacity = '0.4';
                p.style.transform = 'scale(1.5)';
            }, true);
            container.addEventListener('mouseleave', function(e) {
                var p = e.target.closest && e.target.closest('.star-particle');
                if (!p) return;
                p.textContent = p.dataset.orig;
                p.style.opacity = '0.18';
                p.style.transform = 'scale(1)';
            }, true);
            container.addEventListener('click', function(e) {
                var p = e.target.closest && e.target.closest('.star-particle');
                if (!p) return;
                e.stopPropagation();
                var s = randStr();
                p.dataset.orig = s;
                p.textContent = s;
                p.style.opacity = '0.6';
                p.style.transform = 'scale(1.8)';
                setTimeout(function() { p.style.opacity = '0.18'; p.style.transform = 'scale(1)'; }, 200);
            });
        }

        function animateTitle() {
            var title = document.getElementById('title');
            var hint  = document.getElementById('hint');

            setTimeout(function() {
                title.style.animation = 'emergeFromStar 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
                setTimeout(function() {
                    title.classList.add('title-breathing');
                    hint.style.opacity = '0.3';
                }, 1800);
            }, 1400);
        }

        function goToStory() {
            if (document.body.classList.contains('leaving')) return;
            document.body.classList.add('leaving');
            setTimeout(function() {
                window.location.href = '/mama/story/';
            }, 550);
        }

        document.body.addEventListener('click', function(e) {
            if (e.target.closest && e.target.closest('.star-particle')) return;
            goToStory();
        });

        createStarFog();
        animateTitle();
    </script>
</body>
</html>

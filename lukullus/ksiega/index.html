<title>lookoolus — księga znakoo</title>
<style>html,body{margin:0;background:#F2F2F2}a{color:#000000}a:hover{color:#DC4A41}em{font-style:normal;color:#DC4A41}</style>
</head>
<body>
<div id="app" style="width: 794px; margin: 32px auto; outline: 2px solid #000000"></div>
<script type="text/x-dc-tpl" id="tpl"><div style="width: 794px; box-sizing: border-box; padding: 72px; background: #FFFFFF; color: #000000; font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 1.55">

  <div style="display: flex; justify-content: space-between; font-size: 13px; border-bottom: 2px solid #000000; padding-bottom: 10px">
    <span>propozycja · wersja 3</span>
    <span>listopad 2026</span>
  </div>
  <h1 style="margin: 40px 0 10px; font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95">księga zn<em>A</em>koo lookoolus</h1>
  <p style="margin: 0 0 30px; font-size: 20px; line-height: 1.45">zasady oożywania znakoo lookoolus, kolorów, krojoo i przekazoo na opakowaniach.</p>

  <figure style="margin: 0 0 36px; display: flex; justify-content: center">
    <img src="/lukullus/assets/logo.svg" alt="znak lookoolus" style="display: block; width: 360px; height: 360px">
  </figure>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">1. idea</h2>
  <p style="margin: 0 0 12px">lookoolus to nazwa cookierni zapisana tak, jak ją słychać po angielskoo: look-ool-us. pod nią leży czerwone <em>LOOK AT US</em>, czyli spójrz na nas. nazwa i hasło są jednym znakiem.</p>
  <p style="margin: 0 0 32px">dwa o w look to para oczoo i sygnet znakoo. <em>U</em><em>S</em> to my wszyscy, także osoby z depresją, lękiem, chorobą dwoobiegoonową czy schizofrenią. to one mówią na bokach poodełek.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">2. znak</h2>
  <table style="width: 100%; border-collapse: collapse; margin: 0 0 32px; font-size: 15px">
    <thead>
      <tr style="text-align: left; border-top: 2px solid #000000; border-bottom: 1px solid #000000">
        <th style="padding: 8px 12px 8px 0; font-weight: 700; width: 26%">element</th>
        <th style="padding: 8px 0; font-weight: 700">opis</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 12px 8px 0; vertical-align: top">znak główny</td><td style="padding: 8px 0">kwadrat, trzy wiersze, dwie warstwy helvetiki bold w jednym stopnioo: pod spodem czerwone wersaliki <em>LOOK</em> / <em>AT</em> / <em>US</em>, na wierzchoo czarne look / ool / us. warstw nie przesoowamy względem siebie.</td></tr>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 12px 8px 0; vertical-align: top">sygnet</td><td style="padding: 8px 0">oo: dwa o z pierwszego wier<em>S</em>za, z obiema warstwami. ikona, pieczęć, avatar, nadrook na biboołce.</td></tr>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 12px 8px 0; vertical-align: top">nazwa w linii</td><td style="padding: 8px 0">lookoolus, helvetica bold, małe litery, światło −4%, czarna; tam, gdzie kwadrat się nie mieści.</td></tr>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 12px 8px 0; vertical-align: top">wersje</td><td style="padding: 8px 0">na bieli: czerń na czerwieni; na czerni: biel na czerwieni; na czerwieni: biel na czerni.</td></tr>
    </tbody>
  </table>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">3. pole ochronne i rozmiary</h2>
  <p style="margin: 0 0 12px">wokół kwadratoo zostaje wolne pole równe wysokości małego o ze znakoo. nic nie dotyka krawędzi znakoo.</p>
  <table style="width: 100%; border-collapse: collapse; margin: 0 0 32px; font-size: 15px">
    <thead>
      <tr style="text-align: left; border-top: 2px solid #000000; border-bottom: 1px solid #000000">
        <th style="padding: 8px 12px 8px 0; font-weight: 700">element</th>
        <th style="padding: 8px 12px; font-weight: 700; text-align: right">drook</th>
        <th style="padding: 8px 0; font-weight: 700; text-align: right">ekran</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 12px 8px 0">znak główny</td><td style="padding: 8px 12px; text-align: right">20 mm</td><td style="padding: 8px 0; text-align: right">80 px</td></tr>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 12px 8px 0">sygnet oo</td><td style="padding: 8px 12px; text-align: right">6 mm</td><td style="padding: 8px 0; text-align: right">24 px</td></tr>
    </tbody>
  </table>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">4. kolory</h2>
  <p style="margin: 0 0 12px">trzy kolory, jak w znakoo: czerwień pod spodem, czerń na wierzchoo, biel jako papier. czerwień to warstwa <em>LOOK AT US</em>, pojedyncze wielkie litery w tekstach i wnętrze poodełek; nigdy cały tekst. cmyk i wzorzec czerwieni do potwierdzenia na proofie.</p>
  <table style="width: 100%; border-collapse: collapse; margin: 0 0 32px; font-size: 15px">
    <thead>
      <tr style="text-align: left; border-top: 2px solid #000000; border-bottom: 1px solid #000000">
        <th style="padding: 8px 0; font-weight: 700; width: 36px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">próbka</span></th>
        <th style="padding: 8px 12px; font-weight: 700">nazwa</th>
        <th style="padding: 8px 12px; font-weight: 700">hex</th>
        <th style="padding: 8px 12px; font-weight: 700">rgb</th>
        <th style="padding: 8px 0; font-weight: 700">kontrast</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 0"><span style="display: block; width: 24px; height: 24px; background: #DC4A41"></span></td><td style="padding: 8px 12px">czerwień</td><td style="padding: 8px 12px">#dc4a41</td><td style="padding: 8px 12px">220 74 65</td><td style="padding: 8px 0">z bielą 4,1:1, z czernią 5,1:1</td></tr>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 0"><span style="display: block; width: 24px; height: 24px; background: #000000"></span></td><td style="padding: 8px 12px">czerń</td><td style="padding: 8px 12px">#000000</td><td style="padding: 8px 12px">0 0 0</td><td style="padding: 8px 0">z bielą 21:1</td></tr>
      <tr style="border-bottom: 1px solid #000000"><td style="padding: 8px 0"><span style="display: block; width: 24px; height: 24px; background: #FFFFFF; outline: 1px solid #000000"></span></td><td style="padding: 8px 12px">biel</td><td style="padding: 8px 12px">#ffffff</td><td style="padding: 8px 12px">255 255 255</td><td style="padding: 8px 0">tło</td></tr>
    </tbody>
  </table>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">5. krój</h2>
  <p style="margin: 0 0 32px">tylko helvetica. bold: znak, nagłówki, teksty na poodełkach. regoolar: opisy, ceny, adresy. wszystko małymi literami, każde u jako oo. wielkie litery są tylko czerwone i tylko z <em>LOOK AT US</em>: wchodzą w miejsce małej litery, jedna na zdanie albo nagłówek. w doożych stopniach interlinia 0,86 i światło −3%. do drookoo firmowego potrzebna licencja helvetiki; w sieci krój systemowy, zastępczo arial.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">6. przekaz</h2>
  <p style="margin: 0 0 12px">na bokach poodełek mówią o<em>S</em>oby, które łatwo przeoczyć. zasady:</p>
  <ul style="margin: 0 0 16px; padding-left: 20px">
    <li>pierwsza osoba, zwykłe sytooacje z dnia</li>
    <li>bez litości, bez żartów z choroby, bez diagnoz stawianych innym</li>
    <li>jedno zd<em>A</em>nie na ściankę, każde u jako oo, jedna czerwona wielka litera</li>
    <li>końcówki, które zdradzają płeć mówiącej o<em>S</em>oby, piszemy przez x: wstałxm, byłxm, zmęczonx. mówić może każdy</li>
    <li>zdania powstają z osobami w kryzysie i z [organizacja partnerska, do oostalenia], k<em>T</em>óra czyta je przed drookiem</li>
    <li>na każdym poodełkoo jedna ścianka to same noomery pomocy, bez podpi<em>S</em>ów, na całą powierzchnię; sprawdzane przed każdym drookiem</li>
  </ul>
  <p style="margin: 0 0 8px; font-weight: 700">noomery (stan na listopad 2026)</p>
  <p style="margin: 0 0 32px">800 70 2222 — dorośli w kryzysie psychicznym, całą dobę, bezpłatnie · 116 111 — dzieci i młodzież, całą d<em>O</em>bę · 112 — gdy zagrożone jest życie</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">7. opakowania</h2>
  <p style="margin: 0 0 12px">wieko: białe, znak na 82% bokoo, boki wieka czarne z nazwą. dno: dwie ścianki ze zdaniami, jedna czarna z samymi noomerami pomocy na całą ściankę, jedna ze znakiem. wnętrze czerwone, na biboołce sygnet oo.</p>
  <p style="margin: 0 0 32px">zdania wymieniamy co sezon, tak jak wcześniej opa<em>S</em>ki artystów. wykrojnik zostaje ten sam.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">8. czego nie robić</h2>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0 0 32px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 120px; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center; overflow: hidden"><span style="font-size: 30px; font-family: Georgia, serif; font-weight: 700">lookoolus</span></div>
      <figcaption style="font-size: 13px">nie zmieniać krojoo</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 120px; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="/lukullus/assets/logo.svg" alt="" style="display: block; width: 96px; height: 96px; filter: hue-rotate(200deg)"></div>
      <figcaption style="font-size: 13px">nie zmieniać kolorów</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 120px; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="/lukullus/assets/logo.svg" alt="" style="display: block; width: 96px; height: 96px; transform: scaleX(1.6)"></div>
      <figcaption style="font-size: 13px">nie rozciągać</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 120px; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center; overflow: hidden"><span style="font-size: 30px; font-weight: 700; letter-spacing: -0.03em">lookoolUS</span></div>
      <figcaption style="font-size: 13px">nie pisać wielkich liter na czarno</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 120px; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center; padding: 0 10px; text-align: center; font-size: 15px; font-weight: 700; line-height: 1.1"><span>„biedni chorzy potrzeb<em>U</em>ją pomocy”</span></div>
      <figcaption style="font-size: 13px">nie pisać o loodziach z litością i w trzeciej osobie</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 120px; outline: 1px solid #000000; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">800 00 0000</div>
      <figcaption style="font-size: 13px">nie drookować noomerów bez sprawdzenia</figcaption>
    </figure>
  </div>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">9. pliki do przekazania</h2>
  <ul style="margin: 0 0 32px; padding-left: 20px">
    <li>znak w svg i pdf: na bie<em>L</em>i, na czerni, na czerwieni; sygnet oo w trzech wersjach</li>
    <li>wykrojniki pdf: tort, ciastka, cia<em>S</em>teczka, torba</li>
    <li>zdania na sezon w plikoo tekstowym, z akceptacją organizacji partnerskiej</li>
    <li>model 3d poodełek</li>
  </ul>

  <div style="display: flex; justify-content: space-between; border-top: 2px solid #000000; padding-top: 10px; font-size: 13px">
    <span style="font-weight: 700"><em>LOOK AT US</em></span>
    <span>lookoolus, cookiernia warszawska od 1946</span>
  </div>
</div></script>

  <h1 style="margin: 40px 0 8px; font-size: 56px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance">księga znaku Lukullus</h1>
  <p style="margin: 0 0 32px; font-size: 20px; font-weight: 300; line-height: 1.45">zasady używania znaku, kolorów, krojów i glifów cukierni Lukullus. rdzeń marki zostaje: żółć, czerń, szeryf. dochodzi druga warstwa: glify ~||-_^+*., krzyżyki w rogach, groteska i lawenda.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 500; letter-spacing: -0.01em">1. idea</h2>
  <p style="margin: 0 0 12px">w 1946 roku Jan Dynowski otworzył na Pradze zakład „Kremówka”. sygnet to przekrój kremówki: wierzch z ciasta, fala kremu, spód. na wierzchu czereśnia, owoc, który Europa zawdzięcza Lukullusowi.</p>
  <p style="margin: 0 0 32px">warstwy sygnetu to znaki z alfabetu składu: kreska (chrupiące ciasto), fala (krem), podkreślnik (spód), kropka (owoc). razem z || ^ + * daje to osiem znaków, osiem rodzajów warstw. ten sam alfabet opisuje każdy wyrób na pudełku, w cenniku i na stronie, a ułożony w stosy daje ikony działów.</p>

      <tr style="border-bottom: 1px solid #121212"><td style="padding: 8px 12px 8px 0; vertical-align: top">sygnet</td><td style="padding: 8px 0">siatka 15 × 15 modułów, m = grubość warstwy. warstwy szerokie na 11 m, fala o połowę cieńsza, kropka o średnicy 2 m.</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 8px 12px 8px 0; vertical-align: top">znak słowny</td><td style="padding: 8px 0">LUKULLUS, Bodoni Moda 500, wersaliki, światło +8%. zawsze czarny albo mleczny.</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 8px 12px 8px 0; vertical-align: top">podpis</td><td style="padding: 8px 0">„cukiernia warszawska · od 1946”, Inter lub Helvetica Neue 300, małe litery.</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 8px 12px 8px 0; vertical-align: top">układy</td><td style="padding: 8px 0">poziomy (główny), pionowy, sam sygnet, sam znak słowny.</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 8px 12px 8px 0; vertical-align: top">jubileusz</td><td style="padding: 8px 0">L i trzy X na rok 2026, czyli 80 lat po rzymsku. każdy X ma grubą i cienką kreskę jak w Bodoni.</td></tr>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 500">3. pole ochronne</h2>
  <p style="margin: 0 0 16px">wokół znaku zostaje wolne pole 4 m z każdej strony, gdzie m to 1/15 wysokości sygnetu. w polu nie stoi żaden tekst, krawędź ani inny znak.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 500">6. typografia</h2>
  <p style="margin: 0 0 8px"><span style="font-family: 'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif; font-size: 20px; font-weight: 500">Bodoni Moda</span> mówi głosem historii: znak słowny, nazwy wyrobów, lata, cytaty. zastępczo Bodoni 72 lub Didot.</p>
  <p style="margin: 0 0 32px"><span style="font-size: 20px; font-weight: 300">Helvetica Neue / Inter</span> mówi głosem codzienności: nawigacja, opisy, ceny, etykiety. Helvetica Neue w druku, Inter w sieci. tytuły małymi literami, ceny cyframi tabelarycznymi. oba kroje mają pełne polskie znaki. Bodoni Moda i Inter są bezpłatne (licencja OFL); Helvetica Neue do druku firmowego wymaga licencji komercyjnej przy wdrożeniu, a do tego czasu zastępuje ją Inter.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 500">7. alfabet składu i oznakowanie</h2>
  <table style="width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 15px">
    <thead>
      <tr style="text-align: left; border-top: 1.5px solid #121212; border-bottom: 1px solid #121212">
        <th style="padding: 8px 12px 8px 0; font-weight: 500; width: 64px">znak</th>
        <th style="padding: 8px 12px; font-weight: 500">warstwa</th>
        <th style="padding: 8px 0; font-weight: 500">co obejmuje, przykład</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">~</td><td style="padding: 4px 12px">krem</td><td style="padding: 4px 0">krem, mus, karmel; mus gruszkowy w Gruszkach na wierzbie</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">||</td><td style="padding: 4px 12px">biszkopt</td><td style="padding: 4px 0">biszkopt i jego warstwy; biszkopt migdałowy w Torcie piemonckim</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">-</td><td style="padding: 4px 12px">chrupiące</td><td style="padding: 4px 0">ciasto francuskie, kruszonka, pralina; Kremówka jesienna</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">_</td><td style="padding: 4px 12px">ciasto</td><td style="padding: 4px 0">spód albo korpus: kruche, drożdżowe, parzone; Pączek warszawski</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">^</td><td style="padding: 4px 12px">beza</td><td style="padding: 4px 0">beza i dacquoise; Tort cassis</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">+</td><td style="padding: 4px 12px">czekolada</td><td style="padding: 4px 0">ganache, mus, skorupka; tabliczka z góry to siatka krzyżyków; Tort węgierski</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">*</td><td style="padding: 4px 12px">puder</td><td style="padding: 4px 0">cukier puder, kakao, posypka; Bajadera</td></tr>
      <tr style="border-bottom: 1px solid #121212"><td style="padding: 4px 12px 4px 0; font-size: 26px; font-weight: 300">.</td><td style="padding: 4px 12px">owoc</td><td style="padding: 4px 0">owoc, konfitura; czereśnia Lukullusa; Dżungla polska</td></tr>
    </tbody>
  </table>
  <p style="margin: 0 0 12px">oznakowanie: na opakowaniach zawsze cały alfabet w tej samej kolejności, ~ || - _ ^ + * . ; to, co jest w środku, pełną czernią, reszta w 20%. w cenniku, w karcie i na stronie tylko zaczernione znaki, w tej samej kolejności, np. Tort węgierski: ~ ^ + .</p>
  <p style="margin: 0 0 12px">ikony działów to stosy znaków ułożone od góry jak warstwy: tort, ciasto, ciastko, ciasteczka, lody, sezon, pudełko (miejsca), kremówka z sygnetu (o nas). znak nigdy nie oznacza działu sam w sobie.</p>
  <p style="margin: 0 0 32px">krzyżyki w rogach każdego formatu to znaki cięcia: odsunięte o 1/40 krótszego boku, ramię 1/60 krótszego boku, linia 1,5 pt.</p>

  <h2 style="margin: 0 0 12px; font-size: 28px; font-weight: 500">8. opakowania</h2>
  <p style="margin: 0 0 12px">wieko: żółć, sygnet i znak słowny pośrodku, krzyżyki w rogach. sygnet zajmuje 20% boku wieka, znak słowny 10%.</p>
  <p style="margin: 0 0 12px">boki dna: przekrój tego, co jest w środku. każdy znak składu to jedna pozioma warstwa na całą szerokość (fala kremu ~, zęby bezy ^, kostki czekolady +, owoce .), od góry w kolejności alfabetu. w sezonie opaskę może przejąć ilustrator, w 2026 jest wersja jubileuszowa (lawenda z LXXX). ilustracja nie wchodzi na wieko.</p>
  <p style="margin: 0 0 12px">bok wieka: alfabet składu wydrukowany w 20% czerni. przy ladzie leży osiem pieczątek, po jednej na znak; sprzedawca odbija znaki wszystkich wyrobów, które włożył do pudełka.</p>
  <p style="margin: 0 0 32px">wnętrze wieka i dna: lawenda. bibułka: alfabet w lawendzie głębokiej na bieli, zamknięta czarną pieczęcią z sygnetem.</p>

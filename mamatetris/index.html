<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kupa Klocków — dla Mamy</title>
<meta name="description" content="Kupa Klocków: gra dla Mamy na urodziny. Manio, Bimbo, Miłka, Tulek i Szach Mat.">
<meta name="theme-color" content="#28223a">
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --tlo: #f6f3fb;
    --tusz: #241e35;
    --szary: #8a84a0;
    --lawenda: #b9a6ff;
    --ramka: #1b1726;
    --guzik: #ffffff;
    --guzik-cien: #ddd5f3;
    --akcent: #ffce40;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--tlo);
    color: var(--tusz);
    font: 300 15px/1.4 "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    min-height: 100svh;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  header {
    width: 100%; max-width: 420px;
    display: flex; align-items: baseline; justify-content: space-between;
    letter-spacing: .02em; margin-bottom: 8px;
  }
  header b { font-weight: 600; letter-spacing: .14em; font-size: 13px; }
  header span { color: var(--szary); font-size: 13px; }

  /* jeden mocny element: ekran w ramce jak moduł 2,4" */
  .modul {
    background: var(--ramka);
    border-radius: 22px;
    padding: 12px 12px 16px;
    box-shadow: 0 18px 40px -18px rgba(40, 20, 80, .55), inset 0 0 0 1px #2c2640;
    width: min(100%, calc((100svh - 280px) * 0.75 + 24px), 420px);
  }
  .modul canvas {
    display: block; width: 100%; aspect-ratio: 3 / 4;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 6px; background: #000;
    touch-action: none;
  }
  .kropka { width: 6px; height: 6px; border-radius: 50%; background: #3a3350; margin: 10px auto 0; }

  .sterowanie {
    width: 100%; max-width: 420px; margin-top: 14px;
    display: grid; grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; gap: 10px; align-items: center;
  }
  button {
    font: inherit; color: var(--tusz);
    background: var(--guzik); border: 0; border-radius: 16px;
    height: 58px; display: grid; place-items: center;
    box-shadow: 0 4px 0 var(--guzik-cien), 0 6px 16px -10px rgba(60, 30, 120, .5);
    touch-action: manipulation; cursor: pointer;
    transition: transform .05s, box-shadow .05s;
  }
  button.wcisniety { transform: translateY(3px); box-shadow: 0 1px 0 var(--guzik-cien); }
  button svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.2; fill: none;
               stroke-linecap: round; stroke-linejoin: round; }
  button small { display: block; font-size: 10px; letter-spacing: .12em; color: var(--szary); margin-top: -2px; }
  .pokretlo {
    height: 76px; border-radius: 50%; aspect-ratio: 1; justify-self: center;
    background: radial-gradient(circle at 35% 30%, #fff, #ebe5fb 70%);
    box-shadow: 0 5px 0 #cfc4f0, 0 10px 22px -10px rgba(60, 30, 120, .6), inset 0 0 0 2px #fff;
  }
  .pokretlo.wcisniety { box-shadow: 0 1px 0 #cfc4f0, inset 0 0 0 2px #fff; }
  .zrzut { background: var(--tusz); color: #fff; box-shadow: 0 4px 0 #0f0b18; }
  .zrzut small { color: #b6aed0; }
  .zrzut.wcisniety { box-shadow: 0 1px 0 #0f0b18; }
  .rzad2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1.6fr 0.7fr; gap: 10px; }

  .podpowiedz { margin-top: 12px; color: var(--szary); font-size: 12px; text-align: center; letter-spacing: .02em; }
  .podpowiedz kbd { font: inherit; font-weight: 500; color: var(--tusz); }
  .laduje { position: fixed; inset: 0; display: grid; place-items: center; background: var(--tlo);
            color: var(--szary); letter-spacing: .14em; font-size: 12px; transition: opacity .4s; }
  .laduje.znika { opacity: 0; pointer-events: none; }
  @media (hover: none) { .tylko-klawiatura { display: none; } }
  @media (hover: hover) and (min-width: 700px) { .tylko-dotyk { display: none; } }
</style>
</head>
<body>
<header><b>KUPA KLOCKÓW</b><span>dla Mamy · sto lat</span></header>

<div class="modul">
  <canvas id="ekran" width="240" height="320" aria-label="Ekran gry Kupa Klocków"></canvas>
  <div class="kropka"></div>
</div>

<div class="sterowanie" aria-label="Sterowanie">
  <button id="lewo" aria-label="W lewo"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span></span>
  <button id="obrot" class="pokretlo" aria-label="Obróć"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  <span></span>
  <button id="prawo" aria-label="W prawo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="rzad2">
    <button id="szybko" aria-label="Szybciej w dół (trzymaj)"><div><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><small>TRZYMAJ</small></div></button>
    <button id="zrzut" class="zrzut" aria-label="Zrzuć klocek"><div><svg viewBox="0 0 24 24"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/><path d="M5 21h14"/></svg><small>ZRZUĆ</small></div></button>
    <button id="pauza" aria-label="Pauza"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  </div>
</div>

<p class="podpowiedz tylko-klawiatura"><kbd>← →</kbd> ruch · <kbd>↑</kbd> obrót · <kbd>↓</kbd> szybciej · <kbd>spacja</kbd> zrzut · <kbd>P</kbd> pauza</p>
<p class="podpowiedz tylko-dotyk">na ekranie: stuknij = obrót · przesuń w bok = ruch · machnij w dół = zrzut</p>

<div class="laduje" id="laduje">ŁADUJĘ KUPĘ KLOCKÓW…</div>

<script src="/mamatetris/kupa.js"></script>
<script>
(async () => {
  const M = await KupaModule({ locateFile: p => "/mamatetris/" + p });
  const cv = document.getElementById("ekran");
  const ctx = cv.getContext("2d");
  const obraz = ctx.createImageData(240, 320);
  const ptr = M._kupa_rgba();
  const N = 240 * 320 * 4;
  (function rysuj() {
    obraz.data.set(M.HEAPU8.subarray(ptr, ptr + N));
    ctx.putImageData(obraz, 0, 0);
    requestAnimationFrame(rysuj);
  })();
  document.getElementById("laduje").classList.add("znika");

  // Przycisk musi być wciśnięty co najmniej 70 ms, żeby gra go zauważyła (filtr drgań jak na płytce).
  function przycisk(ustaw) {
    let od = 0, puscZa = null;
    return {
      wcisnij() { clearTimeout(puscZa); od = performance.now(); ustaw(1); },
      pusc() {
        const ile = performance.now() - od;
        clearTimeout(puscZa);
        puscZa = setTimeout(() => ustaw(0), Math.max(0, 70 - ile));
      },
    };
  }
  const enc = przycisk(d => M._kupa_enc(d));
  const k0 = przycisk(d => M._kupa_key(d));
  const krok = d => M._kupa_obrot(d);
  const pauza = () => { k0.wcisnij(); setTimeout(() => M._kupa_key(0), 720); };

  function podepnij(id, wcisnij, pusc) {
    const el = document.getElementById(id);
    const w = e => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); el.classList.add("wcisniety"); wcisnij(); };
    const p = e => { if (!el.classList.contains("wcisniety")) return; el.classList.remove("wcisniety"); pusc && pusc(); };
    el.addEventListener("pointerdown", w);
    el.addEventListener("pointerup", p);
    el.addEventListener("pointercancel", p);
    el.addEventListener("contextmenu", e => e.preventDefault());
  }
  // ruch z powtarzaniem przy przytrzymaniu
  function ruch(d) {
    let t1 = null, t2 = null;
    return [() => { krok(d); t1 = setTimeout(() => { t2 = setInterval(() => krok(d), 85); }, 230); },
            () => { clearTimeout(t1); clearInterval(t2); }];
  }
  podepnij("lewo", ...ruch(-1));
  podepnij("prawo", ...ruch(1));
  podepnij("obrot", () => enc.wcisnij(), () => enc.pusc());
  podepnij("szybko", () => M._kupa_szybko(1), () => M._kupa_szybko(0));
  podepnij("zrzut", () => k0.wcisnij(), () => k0.pusc());
  podepnij("pauza", pauza);

  // klawiatura
  const wcisniete = new Set();
  addEventListener("keydown", e => {
    const k = e.key;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Enter"].includes(k)) e.preventDefault();
    if (k === "ArrowLeft" || k === "a") krok(-1);
    else if (k === "ArrowRight" || k === "d") krok(1);
    if (e.repeat || wcisniete.has(k)) return;
    wcisniete.add(k);
    if (k === "ArrowUp" || k === "w" || k === "x") enc.wcisnij();
    else if (k === "ArrowDown" || k === "s") M._kupa_szybko(1);
    else if (k === " " || k === "Enter") k0.wcisnij();
    else if (k === "p" || k === "Escape") pauza();
  });
  addEventListener("keyup", e => {
    const k = e.key;
    wcisniete.delete(k);
    if (k === "ArrowUp" || k === "w" || k === "x") enc.pusc();
    else if (k === "ArrowDown" || k === "s") M._kupa_szybko(0);
    else if (k === " " || k === "Enter") k0.pusc();
  });

  // gesty na ekranie: stuknięcie = obrót, przesunięcie w bok = ruch, machnięcie w dół = zrzut
  let g = null;
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    g = { x: e.clientX, y: e.clientY, t: performance.now(), krokX: e.clientX, ruszyl: false };
  });
  cv.addEventListener("pointermove", e => {
    if (!g) return;
    const kratka = cv.clientWidth / 240 * 12 * 1.4;   // jedna kratka planszy z zapasem
    while (e.clientX - g.krokX > kratka) { krok(1); g.krokX += kratka; g.ruszyl = true; }
    while (g.krokX - e.clientX > kratka) { krok(-1); g.krokX -= kratka; g.ruszyl = true; }
  });
  const koniecGestu = e => {
    if (!g) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y, dt = performance.now() - g.t;
    if (!g.ruszyl && dy > 50 && dy > Math.abs(dx) * 1.5 && dt < 450) { k0.wcisnij(); k0.pusc(); }
    else if (!g.ruszyl && Math.hypot(dx, dy) < 12 && dt < 350) { enc.wcisnij(); enc.pusc(); }
    g = null;
  };
  cv.addEventListener("pointerup", koniecGestu);
  cv.addEventListener("pointercancel", () => { g = null; });

  // pod telefonem nie przewijaj strony przy graniu
  document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
})();
</script>
</body>
</html>
